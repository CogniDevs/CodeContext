name: Build and Release Desktop Application

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: CodeContext_Windows.exe
            output_file: dist/CodeContext.exe
          - os: ubuntu-latest
            asset_name: CodeContext_Linux.tar.gz
            output_file: CodeContext_Linux.tar.gz
          - os: macos-latest
            asset_name: CodeContext_macOS.zip
            output_file: CodeContext_macOS.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codecontext_core

      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Run unified build script
        run: |
          python build.py

      - name: Package Linux artifact
        if: runner.os == 'Linux'
        run: |
          tar -czvf CodeContext_Linux.tar.gz -C dist CodeContext

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r ../CodeContext_macOS.zip CodeContext

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.output_file }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
